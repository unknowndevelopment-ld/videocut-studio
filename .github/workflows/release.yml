name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt 6.8 + MinGW + Ninja + CMake
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_mingw `
            -m qtmultimedia qtshadertools --outputdir C:\Qt
          python -m aqt install-tool windows desktop tools_mingw1310 --outputdir C:\Qt
          python -m aqt install-tool windows desktop tools_cmake --outputdir C:\Qt
          python -m aqt install-tool windows desktop tools_ninja --outputdir C:\Qt

      - name: WiX 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools\wix | Out-Null
          Invoke-WebRequest `
            -Uri https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip `
            -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath tools\wix -Force

      - name: ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor\ffmpeg | Out-Null
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          $bin = Get-ChildItem ffmpeg-tmp -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)\bin\ffmpeg.exe"  vendor\ffmpeg\
          Copy-Item "$($bin.FullName)\bin\ffprobe.exe" vendor\ffmpeg\

      - name: Build + package MSI
        shell: pwsh
        run: .\package.ps1 -Repo "${{ github.repository }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-cpp/VideoCutStudio-Setup-*.exe
            dist-cpp/update.json
          generate_release_notes: true
          draft: false

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoCutStudio-setup
          path: dist-cpp/VideoCutStudio-Setup-*.exe
